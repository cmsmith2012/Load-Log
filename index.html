const BAR_WEIGHT = 45;
const AVAILABLE_PLATES = [45, 35, 25, 10, 5, 2.5];
const PLATE_SIZE = { 45: 54, 35: 48, 25: 42, 10: 34, 5: 28, 2.5: 22 };

function greedyPlates(amount) {
  let remaining = amount;
  const plates = [];
  for (const p of AVAILABLE_PLATES) {
    while (remaining >= p - 0.001) { plates.push(p); remaining -= p; }
  }
  return plates;
}
function smithPlates(total) {
  const perSide = (total - BAR_WEIGHT) / 2;
  if (perSide <= 0) return [];
  return greedyPlates(perSide);
}
function cablePlates(total) {
  if (total <= 0) return [];
  return greedyPlates(total);
}

function PlateRow({ plates, empty }) {
  if (empty) return <span style={{fontSize:12, color:"#6b675e"}}>{empty}</span>;
  return (
    <div style={{ display:"flex", alignItems:"center" }}>

        <div key={i} style={{

        }}>
          <span className="display" style={{ fontSize: PLATE_SIZE[p] > 36 ? 12 : 9, color:"#e8e6df" }}>{p}</span>
        </div>

    </div>

}

function MirroredPlates({ plates, empty }) {
  if (empty) return <span style={{fontSize:12, color:"#6b675e"}}>{empty}</span>;
  const reversed = [...plates].reverse();
  return (
    <div style={{ display:"flex", alignItems:"center" }}>

        <div key={`l${i}`} style={{

        }}>
          <span className="display" style={{ fontSize: PLATE_SIZE[p] > 36 ? 12 : 9, color:"#e8e6df" }}>{p}</span>

      ))}

      {plates.map((p,i) => (
        <div key={`r${i}`} style={{
          width: PLATE_SIZE[p], height: PLATE_SIZE[p], marginLeft: i===0?0:-5,
          borderRadius: "50%", background: "#161613", border: "2px solid #3a3d38",
          boxShadow: "inset 0 0 0 3px #0d0d0b", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0
        }}>

// --- localStorage helpers ---
function keyFor(id) { return `loadlog:${id}`; }
function loadJSON(key, fallback) {
  try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
  catch { return fallback; }
}
function saveJSON(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch { return false; }
}
function topWeight(session) { return Math.max(...session.sets.map(s => s.weight)); }
function dateStr(iso) { return new Date(iso).toISOString().slice(0,10); }

function startOfWeek(d) {
  const date = new Date(d);
  const day = date.getDay();
  const diff = (day === 0 ? -6 : 1) - day;
  date.setDate(date.getDate() + diff);
  date.setHours(0,0,0,0);
  return date;
}
function weekKey(iso) { return dateStr(startOfWeek(new Date(iso))); }

function MiniLine({ data, height }) {
  const h = height || 48, w = 260, pad = 6;
  if (data.length < 2) return <div style={{fontSize:12, color:"#6b675e"}}>Log a couple more sessions to see a trend</div>;
  const vals = data.map(d => d.w);
  const min = Math.min(...vals) - 3, max = Math.max(...vals) + 3;
  const pts = data.map((d,i) => {
    const x = pad + (i/(data.length-1)) * (w - pad*2);
    const y = h - pad - ((d.w - min)/(max-min || 1)) * (h - pad*2);
    return { x, y };
  });
  const line = pts.map(p => `${p.x},${p.y}`).join(" ");
  return (
    <svg width="100%" height={h} viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none">
      <polyline points={line} fill="none" stroke="#cc7a3c" strokeWidth="2" />
      {pts.map((p,i) => <circle key={i} cx={p.x} cy={p.y} r="2.5" fill="#cc7a3c" />)}
    </svg>
  );
}

function MiniBars({ data, max }) {
  const w = 260, h = 56, pad = 4, gap = 4;
  const barW = (w - pad*2 - gap*(data.length-1)) / data.length;
  const scaleMax = max || Math.max(1, ...data.map(d => d.v));
  return (
    <svg width="100%" height={h} viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none">
      {data.map((d,i) => {
        const barH = Math.max(2, (d.v / scaleMax) * (h - pad*2 - 12));
        const x = pad + i*(barW+gap);
        const y = h - pad - 12 - barH;
        return (
          <g key={i}>
            <rect x={x} y={y} width={barW} height={barH} fill={d.v>0 ? "#7a95a3" : "#2c2c26"} rx="2" />
            <text x={x + barW/2} y={h-2} textAnchor="middle" fontSize="8" fill="#6b675e">{d.label}</text>
          </g>
        );
      })}
    </svg>
  );
}

function allTimeBest(sessions) {
  if (!sessions || !sessions.length) return null;
  return Math.max(...sessions.map(topWeight));
}

function FloatingRestTimer({ liftedForButton }) {
  const [secondsLeft, setSecondsLeft] = useState(null);
  const [running, setRunning] = useState(false);
  const [expanded, setExpanded] = useState(false);

  useEffect(() => {
    if (!running || secondsLeft === null) return;
    if (secondsLeft <= 0) { setRunning(false); return; }
    const t = setTimeout(() => setSecondsLeft(s => s - 1), 1000);
    return () => clearTimeout(t);
  }, [running, secondsLeft]);

  const start = (s) => { setSecondsLeft(s); setRunning(true); setExpanded(false); };
  const stop = () => { setRunning(false); setSecondsLeft(null); };

  const mm = secondsLeft !== null ? Math.floor(secondsLeft / 60) : 0;
  const ss = secondsLeft !== null ? secondsLeft % 60 : 0;
  const done = secondsLeft === 0;
  const bottomOffset = liftedForButton ? 84 : 20;

  return (
    <div style={{ position: "fixed", right: 16, bottom: bottomOffset, zIndex: 50, transition: "bottom 0.2s ease" }}>
      {expanded && secondsLeft === null && (
        <div className="fade-in" style={{
          display: "flex", flexDirection: "column", gap: 6, marginBottom: 8,
          background: "#1b1b17", border: "1px solid #2c2c26", borderRadius: 8, padding: 8
        }}>
          {[60, 90, 120].map(s => (
            <button key={s} onClick={() => start(s)} style={{
              fontSize: 13, padding: "8px 18px", borderRadius: 6, background: "#121210",
              border: "1px solid #3a3d38", color: "#ece8de", cursor: "pointer"
            }}>{s}s</button>
          ))}
        </div>
      )}
      <button
        onClick={() => secondsLeft !== null ? stop() : setExpanded(e => !e)}
        style={{
          width: secondsLeft !== null ? "auto" : 56, height: 56, borderRadius: 28,
          padding: secondsLeft !== null ? "0 18px" : 0,
          background: done ? "#7a9d6f" : (secondsLeft !== null ? "#cc7a3c" : "#1b1b17"),
          border: secondsLeft !== null ? "none" : "1px solid #3a3d38",
          color: secondsLeft !== null ? "#161613" : "#8b877c",
          display: "flex", alignItems: "center", justifyContent: "center",
          boxShadow: "0 4px 14px rgba(0,0,0,0.4)", cursor: "pointer"
        }}
      >
        {secondsLeft !== null ? (
          <span className="display" style={{ fontSize: 18 }}>{done ? "Go!" : `${mm}:${String(ss).padStart(2,"0")}`}</span>
        ) : (
          <span className="display" style={{ fontSize: 11, letterSpacing: 0.5 }}>REST</span>
        )}
      </button>
    </div>
  );
}

function SessionHistory({ sessions, onEdit, onDelete }) {
  const [editingIdx, setEditingIdx] = useState(null);
  const [editSets, setEditSets] = useState([]);

  const startEdit = (idx) => {
    setEditingIdx(idx);
    setEditSets(sessions[idx].sets.map(s => ({ weight: String(s.weight), reps: String(s.reps) })));
  };
  const cancelEdit = () => { setEditingIdx(null); setEditSets([]); };
  const saveEdit = (idx) => {
    const clean = editSets
      .filter(s => s.weight !== "" && s.reps !== "" && !isNaN(Number(s.weight)) && !isNaN(Number(s.reps)))
      .map(s => ({ weight: Number(s.weight), reps: Number(s.reps) }));
    if (!clean.length) return;
    onEdit(idx, clean);
    setEditingIdx(null);
  };
  const updateEditRow = (i, field, value) =>
    setEditSets(rows => rows.map((r, idx2) => idx2 === i ? { ...r, [field]: value } : r));

  const ordered = sessions.map((s, i) => ({ ...s, idx: i })).slice().reverse();

  if (!ordered.length) {
    return <div style={{ fontSize:12, color:"#6b675e" }}>No sessions logged yet.</div>;
  }

  return (
    <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
      {ordered.map(s => (
        <div key={s.idx} style={{ background:"#121210", border:"1px solid #2c2c26", borderRadius:6, padding:"8px 10px" }}>
          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
            <span style={{ fontSize:11, color:"#6b675e" }}>
              {new Date(s.date).toLocaleDateString(undefined, { month:"short", day:"numeric", year:"numeric" })}
              {s.equipment ? ` · ${s.equipment}${s.equipment === "cable" && s.cableMode ? ` (${s.cableMode})` : ""}` : ""}
            </span>
            {editingIdx !== s.idx && (
              <div style={{ display:"flex", gap:10 }}>
                <button onClick={() => startEdit(s.idx)} style={{ fontSize:11, color:"#7a95a3", background:"none", border:"none", cursor:"pointer" }}>edit</button>
                <button onClick={() => { if (window.confirm("Delete this logged session? This can't be undone.")) onDelete(s.idx); }} style={{ fontSize:11, color:"#b06a5a", background:"none", border:"none", cursor:"pointer" }}>delete</button>
              </div>
            )}
          </div>

          {editingIdx === s.idx ? (
            <div style={{ marginTop:8 }}>
              <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
                {editSets.map((row, i) => (
                  <div key={i} style={{ display:"flex", alignItems:"center", gap:6 }}>
                    <input type="number" inputMode="numeric" value={row.weight} onChange={e => updateEditRow(i,"weight",e.target.value)}
                      style={{ width:56, padding:"4px", borderRadius:4, textAlign:"center", background:"#0d0d0b", border:"1px solid #3a3d38", color:"#ece8de" }} />
                    <span style={{ color:"#6b675e", fontSize:12 }}>×</span>
                    <input type="number" inputMode="numeric" value={row.reps} onChange={e => updateEditRow(i,"reps",e.target.value)}
                      style={{ width:56, padding:"4px", borderRadius:4, textAlign:"center", background:"#0d0d0b", border:"1px solid #3a3d38", color:"#ece8de" }} />
                  </div>
                ))}
              </div>
              <div style={{ display:"flex", gap:8, marginTop:8 }}>
                <button onClick={() => saveEdit(s.idx)} style={{ fontSize:11, padding:"5px 12px", borderRadius:4, background:"#cc7a3c", color:"#161613", border:"none", cursor:"pointer" }}>Save</button>
                <button onClick={cancelEdit} style={{ fontSize:11, padding:"5px 12px", borderRadius:4, background:"none", border:"1px solid #3a3d38", color:"#8b877c", cursor:"pointer" }}>Cancel</button>
              </div>
            </div>
          ) : (
            <div style={{ fontSize:13, color:"#ece8de", marginTop:2 }}>
              {s.sets.map(set => `${set.weight}×${set.reps}`).join(", ")}
            </div>
          )}
        </div>
      ))}
    </div>
  );
}

                  ref={el => weightRefs.current[idx] = el}
                  onChange={e => {
                    onRowChange(idx, "weight", e.target.value);
                    if (e.target.value) scheduleAdvance(`w-${idx}`, weightRefs.current[idx], repsRefs.current[idx]);
                  }}
                  onKeyDown={e => { if (e.key === "Enter") { e.preventDefault(); repsRefs.current[idx] && repsRefs.current[idx].focus(); } }}
                  style={{ width:56, padding:"6px 4px", borderRadius:4, textAlign:"center", background:"#121210", border:"1px solid #3a3d38", color:"#ece8de" }} />
                <button onClick={() => onRowChange(idx, "weight", String((Number(row.weight)||0) + 5))} style={{
                  width:26, height:30, borderRadius:4, background:"#121210", border:"1px solid #3a3d38", color:"#8b877c", fontSize:15, cursor:"pointer"
                }}>+</button>
                <span style={{ color:"#6b675e", fontSize:12 }}>×</span>
                <input type="text" inputMode="numeric" pattern="[0-9]*" enterKeyHint={idx < rows.length - 1 ? "next" : "done"} placeholder="reps" value={row.reps}
                  ref={el => repsRefs.current[idx] = el}
                  onChange={e => {
                    onRowChange(idx, "reps", e.target.value);
                    if (e.target.value && idx < rows.length - 1) scheduleAdvance(`r-${idx}`, repsRefs.current[idx], weightRefs.current[idx + 1]);
                  }}
                  onKeyDown={e => {
                    if (e.key === "Enter") {
                      e.preventDefault();
                      if (weightRefs.current[idx + 1]) weightRefs.current[idx + 1].focus();
                      else e.target.blur();
                    }
                  }}
                  style={{ width:56, padding:"6px 4px", borderRadius:4, textAlign:"center", background:"#121210", border:"1px solid #3a3d38", color:"#ece8de" }} />
                <button onClick={() => onRemoveRow(idx)} style={{ fontSize:12, color:"#6b675e", background:"none", border:"none", cursor:"pointer" }}>remove</button>
              </div>
            ))}
          </div>

          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginTop:10, flexWrap:"wrap", gap:8 }}>
            <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
              <button onClick={onAddRow} style={{ fontSize:12, padding:"4px 8px", borderRadius:4, color:"#8b877c", background:"none", border:"1px solid #3a3d38", cursor:"pointer" }}>+ set</button>
              {rows.length > 0 && rows[rows.length - 1].weight !== "" && (
                <button onClick={onDuplicateLastSet} style={{ fontSize:12, padding:"4px 8px", borderRadius:4, color:"#8b877c", background:"none", border:"1px solid #3a3d38", cursor:"pointer" }}>
                  + same weight
                </button>
              )}
            </div>
            {delta !== null &&
              <span style={{ fontSize:12, color: delta >= 0 ? "#7a9d6f" : "#b06a5a" }}>
                {delta > 0 ? `+${delta} lb vs last` : delta === 0 ? "matched last" : `${delta} lb vs last`}
              </span>}
          </div>
        </div>
      </div>
    </div>
  );
}

function Dashboard({ history, workoutSessions }) {
  const now = new Date();
  const cutoff30 = new Date(now.getTime() - 30*24*3600*1000);

  // last 8 weeks frequency
  const weeks = [];
  for (let i = 7; i >= 0; i--) {
    const d = new Date(now.getTime() - i*7*24*3600*1000);
    weeks.push(dateStr(startOfWeek(d)));
  }
  const sessionWeekCounts = {};
  workoutSessions.forEach(s => {
    const wk = weekKey(s.date);
    sessionWeekCounts[wk] = (sessionWeekCounts[wk] || 0) + 1;
  });
  const weekBars = weeks.map(wk => ({
    label: wk.slice(5),
    v: sessionWeekCounts[wk] || 0,
  }));

  // streak
  let streak = 0;
  for (let i = weeks.length - 1; i >= 0; i--) {
    if (sessionWeekCounts[weeks[i]] > 0) streak++; else break;
  }

  const totalWorkouts = workoutSessions.length;
  const lastWorkout = workoutSessions.length
    ? new Date(workoutSessions[workoutSessions.length-1].date).toLocaleDateString(undefined, { month:"short", day:"numeric" })
    : "—";

  // this week's total volume (lb) across all exercises
  const thisWeekKey = dateStr(startOfWeek(now));
  let weeklyVolume = 0;
  Object.values(history).forEach(sessions => {
    (sessions || []).forEach(s => {
      if (weekKey(s.date) === thisWeekKey) {
        s.sets.forEach(set => { weeklyVolume += set.weight * set.reps; });
      }
    });
  });

  // muscle group frequency last 30 days (based on all exercises for that
  // muscle) + strength trend based ONLY on fixed anchor lifts, using
  // estimated 1-rep-max (Epley) so reps-at-a-given-weight properly count
  // as a strength gain, and rotating isolation exercises don't blur the line.
  const groupStats = MUSCLE_ORDER.map(group => {
    const exIds = Object.keys(EX).filter(id => EX[id].muscle === group);
    const allSessions = [];
    exIds.forEach(id => (history[id] || []).forEach(s => allSessions.push(s)));

    const recentDates = new Set(
      allSessions.filter(s => new Date(s.date) >= cutoff30).map(s => dateStr(s.date))
    );

    const anchors = ANCHOR_LIFTS.filter(a => a.muscle === group).map(a => {
      const sessions = history[a.exerciseId] || [];
      const byWeek = {};
      sessions.forEach(s => {
        const best1RM = Math.max(...s.sets.map(set => epley1RM(set.weight, set.reps)));
        const wk = weekKey(s.date);
        if (!byWeek[wk]) byWeek[wk] = [];
        byWeek[wk].push(best1RM);
      });
      const trend = Object.keys(byWeek).sort().map((wk, i) => ({
        i: i + 1,
        w: Math.round((byWeek[wk].reduce((a,b) => a+b, 0) / byWeek[wk].length)),
      }));
      const delta = trend.length >= 2 ? Math.round(trend[trend.length-1].w - trend[0].w) : null;
      return { exerciseId: a.exerciseId, name: EX[a.exerciseId].name, trend, delta };
    });

    return { group, freq30: recentDates.size, anchors };
  });

  const maxFreq = Math.max(1, ...groupStats.map(g => g.freq30));

  return (
    <div className="fade-in">
      <div className="display" style={{ fontSize:22, color:"#ece8de", marginBottom:14 }}>Dashboard</div>

      {totalWorkouts === 0 && (
        <div style={{
          background:"#1b1b17", border:"1px solid #2c2c26", borderRadius:6, padding:"20px 16px",
          marginBottom:16, textAlign:"center"
        }}>
          <div className="display" style={{ fontSize:18, color:"#ece8de", marginBottom:4 }}>Nothing logged yet</div>
          <div style={{ fontSize:12, color:"#8b877c" }}>Log your first workout and this page fills in — streaks, weekly volume, strength trends by muscle group.</div>
        </div>
      )}

      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:16 }}>
        <div style={{ background:"#1b1b17", border:"1px solid #2c2c26", borderRadius:6, padding:"10px 12px" }}>
          <div className="display" style={{ fontSize:24, color:"#cc7a3c" }}>{totalWorkouts}</div>
          <div style={{ fontSize:11, color:"#8b877c" }}>total workouts logged</div>
        </div>
        <div style={{ background:"#1b1b17", border:"1px solid #2c2c26", borderRadius:6, padding:"10px 12px" }}>
          <div className="display" style={{ fontSize:24, color:"#cc7a3c" }}>{streak}</div>
          <div style={{ fontSize:11, color:"#8b877c" }}>week streak</div>
        </div>
        <div style={{ background:"#1b1b17", border:"1px solid #2c2c26", borderRadius:6, padding:"10px 12px" }}>
          <div className="display" style={{ fontSize:24, color:"#cc7a3c" }}>{lastWorkout}</div>
          <div style={{ fontSize:11, color:"#8b877c" }}>last workout</div>
        </div>
        <div style={{ background:"#1b1b17", border:"1px solid #2c2c26", borderRadius:6, padding:"10px 12px" }}>
          <div className="display" style={{ fontSize:24, color:"#cc7a3c" }}>{weeklyVolume.toLocaleString()}</div>
          <div style={{ fontSize:11, color:"#8b877c" }}>lb moved this week</div>
        </div>
      </div>

      <div style={{ background:"#1b1b17", border:"1px solid #2c2c26", borderRadius:6, padding:"12px 14px", marginBottom:14 }}>
        <div style={{ fontSize:13, color:"#ece8de", marginBottom:6 }}>Workouts per week (last 8)</div>
        <MiniBars data={weekBars} />
      </div>

      <div className="display" style={{ fontSize:18, color:"#ece8de", marginBottom:8 }}>By muscle group</div>
      <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
        {groupStats.map(g => (
          <div key={g.group} style={{ background:"#1b1b17", border:"1px solid #2c2c26", borderRadius:6, padding:"12px 14px" }}>
            <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
              <span className="display" style={{ fontSize:17, color:"#ece8de" }}>{g.group}</span>
              <span style={{ fontSize:11, color:"#8b877c" }}>{g.freq30}x in last 30 days</span>
            </div>
            <div style={{ marginTop:6, background:"#121210", borderRadius:3, height:5, overflow:"hidden" }}>
              <div style={{ width:`${(g.freq30/maxFreq)*100}%`, background:"#7a95a3", height:"100%" }} />
            </div>
            <div style={{ marginTop:10 }}>
              {g.anchors.length === 0 && (
                <div style={{ fontSize:11, color:"#6b675e" }}>No fixed anchor lift for {g.group} — its exercises rotate each block.</div>
              )}
              {g.anchors.map(a => (
                <div key={a.exerciseId} style={{ marginBottom: 10 }}>
                  <div style={{ fontSize:11, color:"#8b877c", marginBottom:2 }}>{a.name} · est. 1RM</div>
                  {a.trend.length >= 2 ? (
                    <>
                      <MiniLine data={a.trend} height={40} />
                      <div style={{ fontSize:11, marginTop:2, color: a.delta >= 0 ? "#7a9d6f" : "#b06a5a" }}>
                        {a.delta > 0 ? `+${a.delta} lb est. 1RM trend` : a.delta === 0 ? "holding steady" : `${a.delta} lb est. 1RM trend`}
                      </div>
                    </>
                  ) : (
                    <div style={{ fontSize:11, color:"#6b675e" }}>Log a few more sessions to see a strength trend</div>
                  )}
                </div>
              ))}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function collectAllData() {
  const ids = Object.keys(EX);
  const history = {};
  ids.forEach(id => { history[id] = loadJSON(keyFor(id), []); });
  const workoutSessions = loadJSON(keyFor("workoutSessions"), []);
  const bodyweight = loadJSON(keyFor("bodyweight"), []);
  const blockState = loadJSON(keyFor("blockState"), null);
  return {
    version: 2,
    exportedAt: new Date().toISOString(),
    history,
    workoutSessions,
    bodyweight,
    blockState,
  };
}

function downloadBackup() {
  const data = collectAllData();
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const now = new Date();
  const stamp = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;
  a.href = url;
  a.download = `loadlog-backup-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  saveJSON(keyFor("lastBackupAt"), new Date().toISOString());
  saveJSON(keyFor("sessionsSinceBackup"), 0);
}

function restoreBackup(data, onDone) {
  if (!data || !data.history) { onDone(false, "That file doesn't look like a Load Log backup."); return; }
  try {
    Object.keys(data.history).forEach(id => {
      saveJSON(keyFor(id), data.history[id]);
    });
    saveJSON(keyFor("workoutSessions"), data.workoutSessions || []);
    if (data.bodyweight) saveJSON(keyFor("bodyweight"), data.bodyweight);
    if (data.blockState) saveJSON(keyFor("blockState"), data.blockState);
    const parts = ["workouts"];
    if (data.bodyweight) parts.push("bodyweight log");
    if (data.blockState) parts.push("rotation progress");
    onDone(true, `Backup restored — ${parts.join(", ")}.`);
  } catch (e) {
    onDone(false, "Couldn't read that file.");
  }
}

function BackupPanel({ onRestored }) {
  const [message, setMessage] = useState("");
  const [lastBackupAt, setLastBackupAt] = useState(loadJSON(keyFor("lastBackupAt"), null));
  const fileInputRef = React.useRef(null);

  const handleExport = () => {
    downloadBackup();
    setLastBackupAt(new Date().toISOString());
    setMessage("Backup file downloaded — move it to Files or iCloud Drive to keep it safe.");
    setTimeout(() => setMessage(""), 4000);
  };

  const handleImportClick = () => fileInputRef.current && fileInputRef.current.click();

  const handleFileChange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        restoreBackup(data, (ok, msg) => {
          setMessage(msg);
          if (ok && onRestored) onRestored();
          setTimeout(() => setMessage(""), 4000);
        });
      } catch {
        setMessage("Couldn't read that file — make sure it's a Load Log backup .json.");
        setTimeout(() => setMessage(""), 4000);
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  return (
    <div className="fade-in">
      <div className="display" style={{ fontSize:22, color:"#ece8de", marginBottom:14 }}>Backup</div>

      <div style={{ background:"#1b1b17", border:"1px solid #2c2c26", borderRadius:6, padding:"14px 16px", marginBottom:12 }}>
        <div style={{ fontSize:13, color:"#ece8de", marginBottom:4 }}>Save a backup</div>
        <div style={{ fontSize:12, color:"#8b877c", marginBottom:10 }}>
          Downloads all your logged workouts as one file. On iPhone, save it to Files or iCloud Drive when prompted —
          that copy survives even if this app's local data ever gets cleared.
        </div>
        <button onClick={handleExport} style={{
          width:"100%", padding:"10px", borderRadius:6, fontSize:14, fontWeight:600,
          background:"#cc7a3c", color:"#161613", border:"none", cursor:"pointer"
        }}>Download backup file</button>
        <div style={{ fontSize:11, color:"#6b675e", marginTop:8 }}>
          {lastBackupAt ? `Last backup: ${new Date(lastBackupAt).toLocaleString()}` : "No backup taken yet"}
        </div>
      </div>

      <div style={{ background:"#1b1b17", border:"1px solid #2c2c26", borderRadius:6, padding:"14px 16px" }}>
        <div style={{ fontSize:13, color:"#ece8de", marginBottom:4 }}>Restore from a backup</div>
        <div style={{ fontSize:12, color:"#8b877c", marginBottom:10 }}>
          Pick a previously downloaded backup file to restore your history. This replaces current data for any
          exercise included in the file.
        </div>
        <button onClick={handleImportClick} style={{
          width:"100%", padding:"10px", borderRadius:6, fontSize:14, fontWeight:600,
          background:"#1b1b17", color:"#ece8de", border:"1px solid #3a3d38", cursor:"pointer"
        }}>Choose backup file</button>
        <input ref={fileInputRef} type="file" accept="application/json" style={{ display:"none" }} onChange={handleFileChange} />
      </div>

      {message && <div style={{ marginTop:12, fontSize:12, color:"#7a9d6f" }}>{message}</div>}
    </div>
  );
}

function BodyweightPanel() {
  const [entries, setEntries] = useState(() => loadJSON(keyFor("bodyweight"), []));
  const [input, setInput] = useState("");

  const handleLog = () => {
    const w = Number(input);
    if (!input || isNaN(w) || w <= 0) return;
    const updated = [...entries, { date: new Date().toISOString(), weight: w }];
    setEntries(updated);
    saveJSON(keyFor("bodyweight"), updated);
    setInput("");
  };

  const chartData = entries.map((e,i) => ({ i: i+1, w: e.weight }));
  const current = entries.length ? entries[entries.length-1].weight : null;
  const cutoff30 = Date.now() - 30*24*3600*1000;
  const past = entries.filter(e => new Date(e.date).getTime() <= cutoff30);
  const ref30 = past.length ? past[past.length-1].weight : (entries.length ? entries[0].weight : null);
  const delta30 = current !== null && ref30 !== null ? Math.round((current - ref30)*10)/10 : null;

  return (
    <div className="fade-in">
      <div className="display" style={{ fontSize:22, color:"#ece8de", marginBottom:14 }}>Bodyweight</div>

      <div style={{ display:"flex", gap:10, marginBottom:14 }}>
        <div style={{ flex:1, background:"#1b1b17", border:"1px solid #2c2c26", borderRadius:6, padding:"10px 12px" }}>
          <div className="display" style={{ fontSize:24, color:"#cc7a3c" }}>{current !== null ? `${current}` : "—"}</div>
          <div style={{ fontSize:11, color:"#8b877c" }}>current, lb</div>
        </div>
        <div style={{ flex:1, background:"#1b1b17", border:"1px solid #2c2c26", borderRadius:6, padding:"10px 12px" }}>
          <div className="display" style={{ fontSize:24, color: delta30 === null ? "#ece8de" : (delta30 >= 0 ? "#7a9d6f" : "#b06a5a") }}>
            {delta30 === null ? "—" : (delta30 > 0 ? `+${delta30}` : delta30)}
          </div>
          <div style={{ fontSize:11, color:"#8b877c" }}>change, ~30 days</div>
        </div>
      </div>

      <div style={{ background:"#1b1b17", border:"1px solid #2c2c26", borderRadius:6, padding:"14px 16px", marginBottom:14 }}>
        <div style={{ fontSize:13, color:"#ece8de", marginBottom:8 }}>Log today's weight</div>
        <div style={{ display:"flex", gap:8 }}>
          <input type="number" inputMode="decimal" placeholder="lb" value={input}
            onChange={e => setInput(e.target.value)}
            style={{ flex:1, padding:"8px 10px", borderRadius:4, textAlign:"center", background:"#121210", border:"1px solid #3a3d38", color:"#ece8de" }} />
          <button onClick={handleLog} style={{
            padding:"8px 16px", borderRadius:6, fontSize:14, fontWeight:600,
            background:"#cc7a3c", color:"#161613", border:"none", cursor:"pointer"

      </div>

      <div style={{ background:"#1b1b17", border:"1px solid #2c2c26", borderRadius:6, padding:"14px 16px" }}>
        <div style={{ fontSize:13, color:"#ece8de", marginBottom:8 }}>Trend</div>
        <MiniLine data={chartData} height={70} />
      </div>
    </div>
  );
}

function bestSetEver(sessions) {
  let best = null;
  (sessions || []).forEach(s => {
    s.sets.forEach(set => {
      const est = epley1RM(set.weight, set.reps);
      if (!best || est > best.est1RM) {
        best = { weight: set.weight, reps: set.reps, date: s.date, est1RM: est };
      }
    });
  });
  return best;
}

function PRPanel({ history }) {
  const now = Date.now();
  const cutoffNew = now - 14 * 24 * 3600 * 1000;

  const groups = MUSCLE_ORDER.map(muscle => {
    const rows = Object.keys(EX)
      .filter(id => EX[id].muscle === muscle)
      .map(id => ({ id, name: EX[id].name, pr: bestSetEver(history[id]) }))
      .filter(r => r.pr)
      .sort((a, b) => b.pr.est1RM - a.pr.est1RM);
    return { muscle, rows };
  }).filter(g => g.rows.length > 0);

  return (
    <div className="fade-in">
      <div className="display" style={{ fontSize:22, color:"#ece8de", marginBottom:14 }}>Personal Records</div>

      {groups.length === 0 && (
        <div style={{
          background:"#1b1b17", border:"1px solid #2c2c26", borderRadius:6, padding:"20px 16px", textAlign:"center"
        }}>
          <div className="display" style={{ fontSize:18, color:"#ece8de", marginBottom:4 }}>No PRs yet</div>
          <div style={{ fontSize:12, color:"#8b877c" }}>Log a few workouts and your best-ever lifts will show up here.</div>
        </div>
      )}

      <div style={{ display:"flex", flexDirection:"column", gap:14 }}>
        {groups.map(g => (
          <div key={g.muscle}>
            <div className="display" style={{ fontSize:16, color:"#8b877c", marginBottom:6 }}>{g.muscle}</div>
            <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
              {g.rows.map(r => {
                const isNew = new Date(r.pr.date).getTime() >= cutoffNew;
                return (
                  <div key={r.id} style={{
                    display:"flex", alignItems:"center", justifyContent:"space-between",
                    background:"#1b1b17", border:"1px solid #2c2c26", borderRadius:6, padding:"10px 12px"
                  }}>
                    <div>
                      <div style={{ fontSize:13, color:"#ece8de" }}>{r.name}</div>
                      <div style={{ fontSize:11, color:"#6b675e", marginTop:1 }}>
                        {new Date(r.pr.date).toLocaleDateString(undefined, { month:"short", day:"numeric", year:"numeric" })}
                      </div>
                    </div>
                    <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                      {isNew && (
                        <span style={{ fontSize:10, padding:"2px 6px", borderRadius:4, background:"#2e2a1c", color:"#cc7a3c" }}>NEW</span>
                      )}
                      <span className="display" style={{ fontSize:17, color:"#cc7a3c" }}>{r.pr.weight}×{r.pr.reps}</span>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function blankRows() { return [{ weight: "", reps: "" }]; }

function defaultSelectionsForDay(dayId) {
  const selections = {};
  SLOT_TEMPLATES[dayId].forEach(slot => {
    if (slot.fixed) { selections[slot.id] = slot.options[0]; return; }
    const candidates = Object.keys(MIGRATION_MAP)
      .filter(oldId => slot.options.includes(MIGRATION_MAP[oldId]))
      .map(oldId => ({ newId: MIGRATION_MAP[oldId], count: loadJSON(keyFor(oldId), []).length }));
    if (candidates.length) {
      candidates.sort((a, b) => b.count - a.count);
      selections[slot.id] = candidates[0].newId;
    } else {
      selections[slot.id] = slot.options[0];
    }
  });
  return selections;
}

function defaultBlockStateAllDays() {
  const now = new Date().toISOString();
  const state = {};
  Object.keys(SLOT_TEMPLATES).forEach(dayId => {
    state[dayId] = { blockStartDate: now, selections: defaultSelectionsForDay(dayId) };
  });
  return state;
}

function runMigrationIfNeeded() {
  const migrated = loadJSON(keyFor("migratedV2"), false);
  if (migrated) return;

  Object.keys(MIGRATION_MAP).forEach(oldId => {
    const newId = MIGRATION_MAP[oldId];
    const oldData = loadJSON(keyFor(oldId), []);
    if (oldData.length) {
      const existing = loadJSON(keyFor(newId), []);
      const merged = [...existing, ...oldData].sort((a, b) => new Date(a.date) - new Date(b.date));
      saveJSON(keyFor(newId), merged);
    }
  });

  saveJSON(keyFor("blockState"), defaultBlockStateAllDays());
  saveJSON(keyFor("migratedV2"), true);
}

// per-day block state — each day tracks its own active weeks and rotates
// independently, so a day you rarely log doesn't get dragged along by
// progress on the days you do log consistently.
function loadBlockState() {
  const state = loadJSON(keyFor("blockState"), null);
  if (state && state.d1 && state.d1.blockStartDate) return state;
  const fresh = defaultBlockStateAllDays();
  saveJSON(keyFor("blockState"), fresh);
  return fresh;
}

function activeWeeksSinceForDay(dayId, startDate, workoutSessions) {
  const startWeek = dateStr(startOfWeek(new Date(startDate)));
  const weeks = new Set();
  workoutSessions.forEach(s => {
    if (s.dayId === dayId && weekKey(s.date) >= startWeek) weeks.add(weekKey(s.date));
  });
  return weeks.size;
}

function rollDayBlockIfDue(dayId, dayBlockState, workoutSessions) {
  const weeksIn = activeWeeksSinceForDay(dayId, dayBlockState.blockStartDate, workoutSessions);
  if (weeksIn < ROTATION_BLOCK_WEEKS) return null;

  const newSelections = { ...dayBlockState.selections };
  const changes = [];
  SLOT_TEMPLATES[dayId].forEach(slot => {
    if (slot.fixed || slot.options.length < 2) return;
    const current = dayBlockState.selections[slot.id];
    const choices = slot.options.filter(o => o !== current);
    const picked = choices.length ? choices[Math.floor(Math.random() * choices.length)] : current;
    newSelections[slot.id] = picked;
    if (picked !== current) {
      changes.push({ slotId: slot.id, from: EX[current].name, to: EX[picked].name });
    }
  });
  return { blockStartDate: new Date().toISOString(), selections: newSelections, changes, changesDismissed: false };
}

function getDayExercises(dayId, selections) {
  return SLOT_TEMPLATES[dayId].map(slot => {
    const exId = (selections && selections[slot.id]) || slot.options[0];
    return { id: exId, name: EX[exId].name, target: slot.target, slotId: slot.id };
  });
}

// fixed, never-rotating anchors — the lifts strength trends should actually
// be based on, since they stay comparable block to block. Any fixed lift
// with a real weight number qualifies, compound or isolation (a DB curl is
// just as comparable over time as a bench press). Band work is excluded —
// resistance-band "weight" isn't a meaningful, comparable number.
const ANCHOR_LIFTS = [];
Object.keys(SLOT_TEMPLATES).forEach(dayId => {
  SLOT_TEMPLATES[dayId].forEach(slot => {
    if (slot.fixed && EX[slot.options[0]].eq !== "band") {
      ANCHOR_LIFTS.push({ exerciseId: slot.options[0], muscle: EX[slot.options[0]].muscle });
    }
  });
});

function epley1RM(weight, reps) {
  return weight * (1 + reps / 30);
}

function App() {
  const [view, setView] = useState("dashboard");
  const [activeDay, setActiveDay] = useState(PLAN_META[0].id);
  const [history, setHistory] = useState({});
  const [workoutSessions, setWorkoutSessions] = useState([]);
  const [blockState, setBlockState] = useState(null);
  const [drafts, setDrafts] = useState(() => {
    const d = {};
    Object.keys(EX).forEach(id => { d[id] = blankRows(); });
    return d;
  });
  const [equipmentSel, setEquipmentSel] = useState(() => {
    const e = {};
    Object.keys(EX).forEach(id => { e[id] = EX[id].eq || "dumbbell"; });
    return e;
  });
  const [cableModeSel, setCableModeSel] = useState(() => {
    const c = {};
    const dualByDefault = new Set(["cable-fly-mid", "cable-fly-low-high", "cable-fly-high-low"]);
    Object.keys(EX).forEach(id => { c[id] = dualByDefault.has(id) ? "dual" : "single"; });
    return c;
  });
  const [justLoggedIds, setJustLoggedIds] = useState(new Set());
  const [banner, setBanner] = useState("");

  const [refreshKey, setRefreshKey] = useState(0);

  const reloadAll = useCallback(() => {
    runMigrationIfNeeded();
    const ids = Object.keys(EX);
    const all = {};
    ids.forEach(id => { all[id] = loadJSON(keyFor(id), []); });
    setHistory(all);
    const sessions = loadJSON(keyFor("workoutSessions"), []);
    setWorkoutSessions(sessions);

    let bs = loadBlockState();
    let changed = false;
    const nextBs = { ...bs };
    Object.keys(SLOT_TEMPLATES).forEach(dayId => {
      const rolled = rollDayBlockIfDue(dayId, bs[dayId], sessions);
      if (rolled) { nextBs[dayId] = rolled; changed = true; }
    });
    if (changed) saveJSON(keyFor("blockState"), nextBs);
    setBlockState(nextBs);
    setRefreshKey(k => k + 1);
  }, []);

  useEffect(() => { reloadAll(); }, [reloadAll]);

  useEffect(() => {
    const sessions = loadJSON(keyFor("workoutSessions"), []);
    if (!sessions.length) return;
    const lastDayId = sessions[sessions.length - 1].dayId;
    const idx = PLAN_META.findIndex(d => d.id === lastDayId);
    if (idx === -1) return;
    const nextDay = PLAN_META[(idx + 1) % PLAN_META.length];
    setActiveDay(nextDay.id);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const handleRowChange = (exId, idx, field, value) => {
    setDrafts(d => ({
      ...d,
      [exId]: d[exId].map((row,i) => i===idx ? { ...row, [field]: value } : row),
    }));
  };
  const handleAddRow = exId => setDrafts(d => ({ ...d, [exId]: [...d[exId], { weight:"", reps:"" }] }));
  const handleDuplicateLastSet = exId => setDrafts(d => {
    const rows = d[exId];
    const lastWeight = rows.length ? rows[rows.length - 1].weight : "";
    return { ...d, [exId]: [...rows, { weight: lastWeight, reps: "" }] };
  });
  const handleRemoveRow = (exId, idx) => setDrafts(d => ({
    ...d, [exId]: d[exId].length > 1 ? d[exId].filter((_,i) => i!==idx) : d[exId],
  }));
  const handleEquipmentChange = (exId, v) => setEquipmentSel(e => ({ ...e, [exId]: v }));
  const handleCableModeChange = (exId, v) => setCableModeSel(c => ({ ...c, [exId]: v }));
  const handleDismissChanges = () => {
    setBlockState(bs => {
      const updated = { ...bs, [activeDay]: { ...bs[activeDay], changesDismissed: true } };
      saveJSON(keyFor("blockState"), updated);
      return updated;
    });
  };
  const handleAutofill = (exId, sets) => setDrafts(d => ({
    ...d, [exId]: sets.map(s => ({ weight: String(s.weight), reps: String(s.reps) })),
  }));

  const handleEditSession = (exId, idx, newSets) => {
    setHistory(h => {
      const updated = [...(h[exId] || [])];
      updated[idx] = { ...updated[idx], sets: newSets };
      saveJSON(keyFor(exId), updated);
      return { ...h, [exId]: updated };
    });
  };

  const handleDeleteSession = (exId, idx) => {
    setHistory(h => {
      const updated = (h[exId] || []).filter((_, i) => i !== idx);
      saveJSON(keyFor(exId), updated);
      return { ...h, [exId]: updated };
    });
  };

  const handleLogDay = () => {
    const dayMeta = PLAN_META.find(d => d.id === activeDay);
    const dayExercises = getDayExercises(activeDay, blockState[activeDay].selections);
    const today = dateStr(new Date());
    const alreadyLoggedToday = workoutSessions.some(s => s.dayId === activeDay && dateStr(s.date) === today);
    if (alreadyLoggedToday) {
      const proceed = window.confirm(`You already logged ${dayMeta.label} today. Log it again?`);
      if (!proceed) return;
    }

    const now = new Date().toISOString();
    const newHistory = { ...history };
    const loggedIds = [];

    dayExercises.forEach(ex => {
      const rows = drafts[ex.id] || [];
      const clean = rows
        .filter(r => r.weight !== "" && r.reps !== "" && !isNaN(Number(r.weight)) && !isNaN(Number(r.reps)))
        .map(r => ({ weight: Number(r.weight), reps: Number(r.reps) }));
      if (clean.length === 0) return; // skip blank exercise, no error
      const session = { date: now, equipment: equipmentSel[ex.id], cableMode: cableModeSel[ex.id], sets: clean };
      const updated = [...(newHistory[ex.id] || []), session];
      newHistory[ex.id] = updated;
      saveJSON(keyFor(ex.id), updated);
      loggedIds.push(ex.id);
    });

    if (loggedIds.length === 0) {
      setBanner("Nothing entered — add at least one exercise before logging.");
      setTimeout(() => setBanner(""), 2500);
      return;
    }

    setHistory(newHistory);

    const newSessions = [...workoutSessions, { date: now, dayId: dayMeta.id }];
    setWorkoutSessions(newSessions);
    saveJSON(keyFor("workoutSessions"), newSessions);

    // reset drafts for this day only
    setDrafts(d => {
      const nd = { ...d };
      dayExercises.forEach(ex => { nd[ex.id] = blankRows(); });
      return nd;
    });

    setJustLoggedIds(new Set(loggedIds));

    const sinceBackup = (loadJSON(keyFor("sessionsSinceBackup"), 0)) + 1;
    saveJSON(keyFor("sessionsSinceBackup"), sinceBackup);
    const lastBackupAt = loadJSON(keyFor("lastBackupAt"), null);
    const daysSinceBackup = lastBackupAt ? (Date.now() - new Date(lastBackupAt).getTime()) / 86400000 : Infinity;

    let msg = `Logged ${loggedIds.length} of ${dayExercises.length} exercises for ${dayMeta.label}.`;
    if (sinceBackup >= 4 || daysSinceBackup >= 7) {
      msg += " Consider backing up your data — see the Backup tab.";
    }

    // check whether logging this session completes THIS DAY's rotation block
    const rolled = rollDayBlockIfDue(activeDay, blockState[activeDay], newSessions);
    if (rolled) {
      const newBlockState = { ...blockState, [activeDay]: rolled };
      saveJSON(keyFor("blockState"), newBlockState);
      setBlockState(newBlockState);
      msg += ` ${dayMeta.label}'s 6-week block is complete — a few exercises just rotated for next time.`;
    }

    setBanner(msg);
    setTimeout(() => { setJustLoggedIds(new Set()); setBanner(""); }, 5000);
  };

  const dayMeta = PLAN_META.find(d => d.id === activeDay);
  const dayExercises = blockState ? getDayExercises(activeDay, blockState[activeDay].selections) : [];

  return (
    <div style={{ minHeight:"100vh", width:"100%", background:"#121210", color:"#ece8de" }}>
      <div style={{ maxWidth:480, margin:"0 auto", padding:"24px 16px 40px" }}>
        <div style={{ marginBottom:20 }}>
          <div style={{ display:"inline-block", borderBottom:"3px solid #cc7a3c", paddingBottom:6 }}>
            <div className="display" style={{ fontSize:36, lineHeight:0.95, letterSpacing:0.5 }}>
              <span className="display" style={{ color:"#ece8de" }}>LOAD </span>
              <span className="display" style={{ color:"#cc7a3c" }}>LOG</span>
            </div>
          </div>
          <div style={{ fontSize:12, marginTop:8, color:"#8b877c" }}>4-day split · progressive overload tracker</div>
        </div>
        <div style={{ display:"flex", gap:6, flexWrap:"wrap", marginBottom:20 }}>
          <button onClick={() => setView("dashboard")} style={{
            fontSize:12, padding:"6px 10px", borderRadius:4, cursor:"pointer",
            background: view==="dashboard" ? "#cc7a3c" : "#1b1b17", color: view==="dashboard" ? "#161613" : "#8b877c",
            border: `1px solid ${view==="dashboard" ? "#cc7a3c" : "#2c2c26"}`
          }}>Dashboard</button>
          <button onClick={() => setView("log")} style={{
            fontSize:12, padding:"6px 10px", borderRadius:4, cursor:"pointer",
            background: view==="log" ? "#cc7a3c" : "#1b1b17", color: view==="log" ? "#161613" : "#8b877c",
            border: `1px solid ${view==="log" ? "#cc7a3c" : "#2c2c26"}`
          }}>Log</button>
          <button onClick={() => setView("weight")} style={{
            fontSize:12, padding:"6px 10px", borderRadius:4, cursor:"pointer",
            background: view==="weight" ? "#cc7a3c" : "#1b1b17", color: view==="weight" ? "#161613" : "#8b877c",
            border: `1px solid ${view==="weight" ? "#cc7a3c" : "#2c2c26"}`
          }}>Weight</button>
          <button onClick={() => setView("prs")} style={{
            fontSize:12, padding:"6px 10px", borderRadius:4, cursor:"pointer",
            background: view==="prs" ? "#cc7a3c" : "#1b1b17", color: view==="prs" ? "#161613" : "#8b877c",
            border: `1px solid ${view==="prs" ? "#cc7a3c" : "#2c2c26"}`
          }}>PRs</button>
          <button onClick={() => setView("backup")} style={{
            fontSize:12, padding:"6px 10px", borderRadius:4, cursor:"pointer",
            background: view==="backup" ? "#cc7a3c" : "#1b1b17", color: view==="backup" ? "#161613" : "#8b877c",
            border: `1px solid ${view==="backup" ? "#cc7a3c" : "#2c2c26"}`
          }}>Backup</button>
        </div>

        {view === "log" && blockState && (
          <div className="fade-in">
            <div style={{ display:"flex", gap:8, marginBottom:20, overflowX:"auto", paddingBottom:4 }}>
              {PLAN_META.map(d => {
                const active = d.id === activeDay;
                return (
                  <button key={d.id} onClick={() => setActiveDay(d.id)} style={{
                    flexShrink:0, width:64, height:64, borderRadius:"50%", cursor:"pointer",
                    background: active ? "#161613" : "#1b1b17",
                    border: `2px solid ${active ? "#cc7a3c" : "#2c2c26"}`
                  }}>
                    <span className="display" style={{ fontSize:18, color: active ? "#cc7a3c" : "#8b877c" }}>{d.num}</span>
                  </button>
                );
              })}
            </div>

            <DayView
              dayMeta={dayMeta}
              exercises={dayExercises}
              history={history}
              drafts={drafts}
              equipmentSel={equipmentSel}
              cableModeSel={cableModeSel}
              onCableModeChange={handleCableModeChange}
              onRowChange={handleRowChange}
              onAddRow={handleAddRow}
              onDuplicateLastSet={handleDuplicateLastSet}
              onRemoveRow={handleRemoveRow}
              onEquipmentChange={handleEquipmentChange}
              onLogDay={handleLogDay}
              justLoggedIds={justLoggedIds}
              banner={banner}
              onAutofill={handleAutofill}
              onEditSession={handleEditSession}
              onDeleteSession={handleDeleteSession}
              blockState={blockState[activeDay]}
              onDismissChanges={handleDismissChanges}
              workoutSessions={workoutSessions}
            />
          </div>
        )}

        {view === "dashboard" && <Dashboard history={history} workoutSessions={workoutSessions} />}
        {view === "weight" && <BodyweightPanel key={refreshKey} />}
        {view === "prs" && <PRPanel history={history} />}
        {view === "backup" && <BackupPanel onRestored={reloadAll} />}
      </div>
      <FloatingRestTimer liftedForButton={view === "log"} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
